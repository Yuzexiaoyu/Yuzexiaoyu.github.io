{{ define "body-class" }}template-workshop{{ end }}
{{ define "left-sidebar" }}<!-- Workshop uses its own navigation. -->{{ end }}
{{ define "right-sidebar" }}{{ end }}
{{ define "main" }}
<div class="wk-shell" data-workshop="detail" data-workshop-source="{{ .Site.Params.workshop.dataSource | default "static" }}">
  {{ partial "workshop/header.html" . }}
  <div class="wk-breadcrumb">
    <a href="/prints/" data-detail-back>← 返回工坊</a>
    <span data-detail-breadcrumb></span>
    <a class="wk-stock-link" data-stock-link hidden>查看现货 <span aria-hidden="true">→</span></a>
  </div>
  <div data-detail-content><div class="wk-empty">正在读取作品…</div></div>
  <dialog class="wk-dialog" data-contact-dialog aria-label="QQ 联系">
    <div class="wk-contact-heading">
      <p>复制清单后，通过 QQ 联系确认。</p>
      <button type="button" class="wk-icon-button wk-dialog-close" data-close-dialog aria-label="关闭" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="wk-contact-body">
      <div data-contact-qr></div>
      <p class="wk-contact-number">QQ：<strong data-contact-number></strong></p>
      <div class="wk-contact-list">
        <button type="button" class="wk-button wk-secondary wk-copy-list" data-copy-again aria-label="复制选购清单">复制</button>
        <textarea data-contact-text readonly aria-label="完整选购清单"></textarea>
      </div>
      <button type="button" class="wk-button wk-primary" data-copy-qq>一键复制 QQ 号</button>
    </div>
    <p class="wk-feedback" data-copy-feedback role="status"></p>
  </dialog>
</div>
{{ end }}
