{{ define "body-class" }}template-workshop{{ end }}
{{ define "left-sidebar" }}<!-- Workshop uses its own navigation. -->{{ end }}
{{ define "right-sidebar" }}{{ end }}
{{ define "main" }}
<div class="wk-shell" data-workshop="detail" data-workshop-source="{{ .Site.Params.workshop.dataSource | default "static" }}">
  {{ partial "workshop/header.html" . }}
  <div class="wk-breadcrumb">
    <a href="/prints/" data-detail-back>← 返回工坊</a>
    <span data-detail-breadcrumb></span>
    <a class="wk-stock-link" data-stock-link hidden>查看现货 <span aria-hidden="true">→</span></a>
  </div>
  <div data-detail-content><div class="wk-empty">正在读取作品…</div></div>
  <dialog class="wk-dialog" data-contact-dialog aria-label="QQ 联系"><button type="button" class="wk-icon-button wk-dialog-close" data-close-dialog aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button><p>复制下方清单，通过 QQ 联系确认。</p><div data-contact-qr></div><textarea data-contact-text readonly aria-label="完整选购清单"></textarea><button type="button" class="wk-button wk-primary" data-copy-again>复制完整清单</button><p class="wk-feedback" data-copy-feedback role="status"></p></dialog>
</div>
{{ end }}
