{{ define "body-class" }}template-workshop{{ end }}
{{ define "left-sidebar" }}<!-- Workshop uses its own navigation. -->{{ end }}
{{ define "right-sidebar" }}{{ end }}
{{ define "main" }}
<div class="wk-shell" data-workshop="catalog" data-workshop-source="{{ .Site.Params.workshop.dataSource | default "static" }}">
  {{ partial "workshop/header.html" . }}
  <section class="wk-collection" id="wk-collection" aria-label="工坊内容">
    <div class="wk-collection-toolbar"><div class="wk-tabs" role="tablist" aria-label="内容栏目"><button type="button" role="tab" data-catalog-tab="work">作品展示 <span data-count="work">—</span></button><button type="button" role="tab" data-catalog-tab="product">可选购商品 <span data-count="product">—</span></button></div></div>
    <div class="wk-grid" data-catalog-grid aria-live="polite"><p class="wk-empty">正在打开工坊…</p></div>
  </section>
</div>
{{ end }}
