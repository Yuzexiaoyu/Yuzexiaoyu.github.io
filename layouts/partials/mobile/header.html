{{ if .Site.Params.mobile.enabled }}
<header class="m-header" hidden>
  <div class="m-heading">
    <a class="m-brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "image/avatar.webp" | relURL }}" width="32" height="32" alt="">
      <span>{{ .Site.Title }}</span>
    </a>
    <div class="m-social" aria-label="社交链接">
      {{ range .Site.Menus.social }}
      <a href="{{ .URL }}" aria-label="{{ .Name }}" title="{{ .Name }}"{{ if .Params.newTab }} target="_blank"{{ end }} rel="noopener">
        {{ partial "helper/icon" (default "link" .Params.Icon) }}
      </a>
      {{ end }}
    </div>
  </div>
  <details class="m-navigation">
    <summary aria-label="打开导航">菜单</summary>
    <nav aria-label="网站导航">
      <button class="m-nav-close" type="button">关闭菜单 ✕</button>
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"{{ if .Params.newTab }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ range where .Site.RegularPages "Layout" "search" }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ end }}
    </nav>
  </details>
</header>
{{ end }}
