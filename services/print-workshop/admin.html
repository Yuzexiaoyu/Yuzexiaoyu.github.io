<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>工坊本地管理 · 雨泽小鱼</title>
<script src="/js/mobile-mode.js"></script>
<!--WORKSHOP_STYLES-->
<style>html{font-size:62.5%}body{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}button,input,textarea,select{font-family:inherit}</style>
</head><body class="template-workshop workshop-admin-page"><main class="main full-width">
<div class="wk-shell" data-workshop="admin">
  <header class="wk-nav"><a class="wk-brand" href="/prints/" data-no-swup><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span>工坊管理</span></a><nav><a href="/prints/" data-no-swup>查看工坊 ↗</a></nav></header>
  <nav class="wk-admin-tabs" aria-label="后台分区"><button type="button" class="is-active" data-admin-tab="entries">内容管理</button><button type="button" data-admin-tab="colors">公共色卡</button></nav>
  <p data-admin-notice class="wk-feedback" role="status"></p>
  <section data-admin-panel="entries"><div class="wk-admin-filter"><label class="wk-search"><span aria-hidden="true">⌕</span><input type="search" data-admin-search placeholder="搜索标题" aria-label="搜索管理内容"></label><div class="wk-admin-actions"><select data-admin-filter aria-label="按状态筛选"><option value="all">全部状态</option><option value="published">已上架</option><option value="draft">草稿</option><option value="archived">已下架</option></select><button type="button" class="wk-button" data-new-entry><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span>新建内容</span></button></div></div><div data-admin-list class="wk-admin-list">正在读取内容…</div></section>
  <section data-admin-panel="colors" hidden><div class="wk-panel-heading"><div><h2>让颜色成为选择</h2><p>为公共色卡填写对应材质，再在可选物品中勾选颜色。</p></div></div><form data-color-form class="wk-color-form"><input name="name" required maxlength="30" placeholder="颜色名称" aria-label="颜色名称"><input name="hex" type="color" value="#87b89e" aria-label="预览颜色"><input name="material" maxlength="80" placeholder="材质，如 PLA、PETG" aria-label="材质"><button class="wk-button wk-primary" type="submit">添加色卡</button></form><div data-color-list class="wk-color-list"></div></section>
  <dialog class="wk-editor" data-entry-editor aria-labelledby="entry-editor-title"><form data-entry-form>
    <div class="wk-editor-heading"><h2 id="entry-editor-title">新建内容</h2><button type="button" class="wk-icon-button wk-editor-close" data-editor-close aria-label="关闭编辑器"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="wk-editor-grid">
      <section class="wk-editor-info" aria-label="标题与介绍">
        <label class="wk-field">标题<input name="name" required maxlength="80" placeholder="标题"></label>
        <div class="wk-fields-row"><label class="wk-field">所属栏目<select name="kind"><option value="work">可选</option><option value="product">现货</option></select></label><label class="wk-field">展示状态<select name="status"><option value="draft">草稿</option><option value="published">上架</option><option value="archived">下架</option></select></label></div>
        <label class="wk-field wk-editor-description">介绍<textarea name="description" rows="5" maxlength="5000" placeholder="介绍"></textarea></label>
        <label class="wk-check"><input name="is_demo" type="checkbox"> 标记为演示内容（不代表真实商品）</label>
      </section>
      <section class="wk-editor-config" aria-label="价格、重量与颜色">
        <fieldset class="wk-product-fields" data-configurable-fields><legend>可选 · 制作配置</legend>
          <div class="wk-fields-row"><label class="wk-field">15% 填充最低价（元）<input name="min_price" type="number" min="0" max="10000000" step="1" value="0" required></label><label class="wk-field">100% 填充最高价（元）<input name="max_price" type="number" min="0" max="10000000" step="1" value="0" required></label></div>
          <div class="wk-fields-row"><label class="wk-field">15% 填充重量（克）<input name="min_weight_g" type="number" min="0.01" max="1000000" step="0.01"></label><label class="wk-field">100% 填充重量（克）<input name="max_weight_g" type="number" min="0.01" max="1000000" step="0.01"></label></div>
          <div class="wk-editor-examples"><label class="wk-editor-fixed-infill">固定填充（%）<input name="fixed_infill" type="number" min="15" max="100" step="1" placeholder="可调"></label><p class="wk-muted" data-price-example></p><p class="wk-muted" data-weight-example></p></div>
        <span class="wk-field-label">可用颜色</span><div data-editor-colors class="wk-editor-colors"></div><div class="wk-editor-pager" data-colors-pager hidden><button type="button" data-page-role="colors" data-page-step="-1" aria-label="上一页颜色">←</button><output></output><button type="button" data-page-role="colors" data-page-step="1" aria-label="下一页颜色">→</button></div></fieldset>
        <fieldset class="wk-product-fields" data-stock-fields hidden><legend>现货 · 成品信息</legend><div class="wk-fields-row"><label class="wk-field">固定售价（元）<input name="fixed_price" type="number" min="0" max="10000000" step="1" placeholder="留空显示敬请期待"></label><label class="wk-field">固定重量（克）<input name="weight_g" type="number" min="0.001" max="1000000" step="0.001"></label></div><label class="wk-field">材质<input name="material" maxlength="80" placeholder="如 PLA、PETG"></label></fieldset>
      </section>
      <div class="wk-editor-assets"><section class="wk-editor-media" aria-label="图片"><div class="wk-asset-heading"><span class="wk-field-label">图片</span><label class="wk-button wk-secondary wk-upload-label" title="最多 12 张，第一张为封面">＋ 添加图片<input type="file" accept="image/png,image/jpeg,image/webp" multiple data-image-upload></label></div>
        <div data-editor-images class="wk-editor-images"></div><div class="wk-editor-pager" data-images-pager hidden><button type="button" data-page-role="images" data-page-step="-1" aria-label="上一页图片">←</button><output></output><button type="button" data-page-role="images" data-page-step="1" aria-label="下一页图片">→</button></div></section><section class="wk-editor-media" aria-label="视频"><div class="wk-asset-heading"><span class="wk-field-label">视频</span><label class="wk-button wk-secondary wk-upload-label" title="最多 6 个，单个最大 64 MB">＋ 添加视频<input type="file" accept="video/mp4,video/webm,video/quicktime" multiple data-video-upload></label></div>
        <div data-editor-videos class="wk-editor-images wk-editor-videos"></div><div class="wk-editor-pager" data-videos-pager hidden><button type="button" data-page-role="videos" data-page-step="-1" aria-label="上一页视频">←</button><output></output><button type="button" data-page-role="videos" data-page-step="1" aria-label="下一页视频">→</button></div></section><div class="wk-editor-files">
      <div class="wk-file-row"><div class="wk-file-text"><span class="wk-field-label">网页预览模型（选填）</span><p data-model-name class="wk-muted">尚未添加 GLB</p></div><div class="wk-file-actions"><label class="wk-button wk-secondary wk-upload-label">选择 GLB<input type="file" accept=".glb" data-model-upload></label><button type="button" class="wk-text-link" data-remove-model>移除</button></div></div>
      <div class="wk-file-row"><div class="wk-file-text"><span class="wk-field-label">Bambu Studio 原件（选填）</span><p data-source-name class="wk-muted">尚未保存 3MF</p></div><div class="wk-file-actions"><label class="wk-button wk-secondary wk-upload-label">保存 3MF<input type="file" accept=".3mf" data-source-upload></label><button type="button" class="wk-text-link" data-remove-source>移除</button></div></div>
    </div></div>
    </div>
    <div class="wk-editor-footer"><p data-editor-notice class="wk-feedback" role="status"></p><button type="button" class="wk-button wk-secondary" data-editor-close>取消</button><button type="submit" class="wk-button wk-primary" data-save-entry>保存内容</button></div>
  </form></dialog>
</div>
</main><script src="<!--WORKSHOP_SCRIPT-->" defer></script><script>document.addEventListener('DOMContentLoaded',function(){if(window.WorkshopApp)window.WorkshopApp.init();});</script></body></html>
