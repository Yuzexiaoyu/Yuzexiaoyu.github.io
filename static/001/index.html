<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图库</title>
<script src="/mobile-config-v2.js"></script>
<script src="/js/mobile-mode.js?v=2"></script>
<style>
html[data-ui="mobile"] body { overflow-x:visible; }
html[data-ui="mobile"] header { padding:calc(24px + env(safe-area-inset-top,0px)) 16px 16px; }
html[data-ui="mobile"] .gallery-wrapper { padding:12px 12px max(20px,env(safe-area-inset-bottom,0px)); }
html[data-ui="mobile"] .cursor-glow { display:none; }
html[data-ui="mobile"] .lightbox-close { top:max(8px,env(safe-area-inset-top,0px)); right:max(8px,env(safe-area-inset-right,0px)); min-width:44px; min-height:44px; }
html[data-ui="mobile"] .lightbox-nav { display:block; width:48px; height:48px; font-size:32px; top:auto; bottom:calc(124px + env(safe-area-inset-bottom,0px)); transform:none; }
html[data-ui="mobile"] .lightbox-nav.prev { left:max(12px,env(safe-area-inset-left,0px)); }
html[data-ui="mobile"] .lightbox-nav.next { right:max(12px,env(safe-area-inset-right,0px)); }
html[data-ui="mobile"] .lightbox-img-container { max-width:100vw; padding:60px 8px 180px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
html[data-ui="mobile"] #lightbox-img { max-height:100%; max-width:100%; object-fit:contain; touch-action:pan-y pinch-zoom; }
html[data-ui="mobile"] .lightbox-info { bottom:max(8px,env(safe-area-inset-bottom,0px)); max-width:100%; gap:4px; }
html[data-ui="mobile"] .lightbox-thumbnails { max-width:94vw; }
html[data-ui="mobile"] .lightbox-nav,html[data-ui="mobile"] .lightbox-close { z-index:3; }
html[data-ui="mobile"] .lightbox-info { z-index:2; }
html[data-ui="mobile"] .lightbox-img-container { pointer-events:none; }
html[data-ui="mobile"] #lightbox-img { pointer-events:auto; }
@media(prefers-reduced-motion:reduce) {
html[data-ui="mobile"] *,html[data-ui="mobile"] *::before,html[data-ui="mobile"] *::after { animation:none!important; transition:none!important; }
}
</style>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #a78bfa;
    --secondary: #38bdf8;
    --accent: #f472b6;
    --bg: #030308;
    --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.06);
    --text: #f0f0f0;
    --text-muted: rgba(255,255,255,0.4);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* 粒子 Canvas 背景 */
#bgCanvas {
    position: fixed;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
}

/* 极光叠加层 */
.aurora-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.4;
    mix-blend-mode: screen;
    background: 
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(88, 28, 135, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 60%, rgba(14, 116, 144, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 20%, rgba(190, 24, 93, 0.08) 0%, transparent 70%);
    animation: auroraShift 15s ease-in-out infinite alternate;
}

@keyframes auroraShift {
    0% { transform: translateX(0) scale(1); filter: hue-rotate(0deg); }
    50% { transform: translateX(-20px) scale(1.02); filter: hue-rotate(15deg); }
    100% { transform: translateX(10px) scale(0.98); filter: hue-rotate(-10deg); }
}

/* 网格装饰 */
.grid-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.02;
    background-image: 
        linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* 顶部进度条 */
.scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    z-index: 9999;
    transition: width 0.1s linear;
    box-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary);
}

/* 头部标题区 - 朴素但显眼 */
header {
    position: relative;
    padding: 6rem 2rem 4rem;
    text-align: center;
}

header h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 500;
    letter-spacing: 0.15em;
    color: #f5f5f7; /* 高对比度的纯白/浅灰，保证显眼 */
    margin: 0;
    /* 朴素的入场动画 */
    opacity: 0;
    transform: translateY(10px);
    animation: simpleFadeIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
}

@keyframes simpleFadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* 画廊 */
.gallery-wrapper {
    padding: 2rem;
    max-width: 1800px;
    margin: 0 auto;
}

.gallery {
    columns: 5;
    column-gap: 10px;
}

.gallery-item {
    break-inside: avoid;
    margin-bottom: 10px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: var(--surface);
    position: relative;
    transform: scale(0.96);
    opacity: 0;
    filter: blur(8px);
    transition: 
        transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
        opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
        filter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.4s ease;
}

.gallery-item.revealed {
    transform: scale(1);
    opacity: 1;
    filter: blur(0);
}

.gallery-item::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.05));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.gallery-item:hover::before {
    opacity: 1;
}

.gallery-item.revealed:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 
        0 20px 40px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.05);
}

.gallery-item .img-wrapper {
    position: relative;
    overflow: hidden;
}

.gallery-item img {
    width: 100%;
    display: block;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.4s ease;
    opacity: 0;
}

.gallery-item img.loaded {
    opacity: 1;
    animation: imgFadeIn 0.5s ease;
}

@keyframes imgFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.gallery-item:hover img {
    transform: scale(1.08);
}

.gallery-item .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    align-items: flex-end;
    padding: 1.2rem;
}

.gallery-item:hover .overlay {
    opacity: 1;
}

.overlay-content {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.9);
    font-size: 0.8rem;
    font-weight: 500;
    transform: translateY(10px);
    transition: transform 0.3s ease 0.05s;
}

.gallery-item:hover .overlay-content {
    transform: translateY(0);
}

.overlay-content svg {
    width: 16px;
    height: 16px;
}

/* 骨架屏 */
.skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 12px;
    margin-bottom: 10px;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* 灯箱 */
.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    backdrop-filter: blur(0px);
    transition: background 0.4s ease, backdrop-filter 0.4s ease;
}

.lightbox.active {
    display: flex;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(30px);
    animation: lbFadeIn 0.3s ease;
}

@keyframes lbFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.lightbox-img-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 90vw;
    max-height: 80vh;
}

.lightbox-img-container img {
    max-width: 90vw;
    max-height: 80vh;
    border-radius: 12px;
    object-fit: contain;
    user-select: none;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: imgZoomIn 0.4s cubic-bezier(0.23, 1, 0.32, 1);
}

@keyframes imgZoomIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.lightbox-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 48px;
    height: 48px;
    border: none;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1.3rem;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.lightbox-close:hover {
    background: rgba(255,255,255,0.1);
    transform: rotate(90deg) scale(1.1);
}

.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border: none;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1.4rem;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.lightbox-nav:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-50%) scale(1.1);
}

.lightbox-nav.prev { left: 2rem; }
.lightbox-nav.next { right: 2rem; }

.lightbox-info {
    position: absolute;
    bottom: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
}

.lightbox-counter {
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 8px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 100px;
    backdrop-filter: blur(10px);
}

.lightbox-thumbnails {
    display: flex;
    gap: 6px;
    max-width: 80vw;
    overflow-x: auto;
    padding: 8px;
    scrollbar-width: none;
}

.lightbox-thumbnails::-webkit-scrollbar { display: none; }

.lightbox-thumbnails .thumb {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    opacity: 0.4;
    transition: all 0.3s ease;
    flex-shrink: 0;
    border: 2px solid transparent;
}

.lightbox-thumbnails .thumb.active {
    opacity: 1;
    border-color: var(--primary);
    transform: scale(1.1);
}

.lightbox-thumbnails .thumb:hover {
    opacity: 0.8;
}

.lightbox-thumbnails .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 鼠标跟随光效 */
.cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
    transform: translate(-50%, -50%);
}

/* 响应式 */
@media (max-width: 1400px) {
    .gallery { columns: 4; }
}

@media (max-width: 1000px) {
    .gallery { columns: 3; }
    header { padding: 4rem 2rem 3rem; }
}

@media (max-width: 700px) {
    .gallery { columns: 2; column-gap: 8px; }
    .gallery-item { margin-bottom: 8px; border-radius: 8px; }
    .gallery-wrapper { padding: 1rem; }
    .lightbox-nav { display: none; }
    header { padding: 3rem 1.5rem 2rem; }
}

@media (max-width: 400px) {
    .gallery { columns: 2; }
}

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { 
    background: rgba(255,255,255,0.1); 
    border-radius: 3px; 
}
::-webkit-scrollbar-thumb:hover { 
    background: rgba(255,255,255,0.2); 
}

/* 选择颜色 */
::selection {
    background: rgba(167,139,250,0.3);
    color: #fff;
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="aurora-overlay"></div>
<div class="grid-overlay"></div>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="scroll-progress" id="scrollProgress"></div>

<header>
    <h1>图库</h1>
</header>

<div class="gallery-wrapper">
    <div class="gallery" id="gallery">
        <div class="skeleton" style="height:200px"></div>
        <div class="skeleton" style="height:280px"></div>
        <div class="skeleton" style="height:180px"></div>
        <div class="skeleton" style="height:320px"></div>
        <div class="skeleton" style="height:240px"></div>
        <div class="skeleton" style="height:190px"></div>
        <div class="skeleton" style="height:260px"></div>
        <div class="skeleton" style="height:220px"></div>
    </div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav prev" onclick="navigate(-1)">&#8249;</button>
    <button class="lightbox-nav next" onclick="navigate(1)">&#8250;</button>
    <div class="lightbox-img-container">
        <img id="lightbox-img" src="" alt="">
    </div>
    <div class="lightbox-info">
        <div class="lightbox-thumbnails" id="thumbnails"></div>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
</div>

<script>
// === 弹性流体粒子背景 ===
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let width, height, particles, mouse, mouseActive;
const mobileGallery = !!(window.__isMobileUI && window.__isMobileUI());
const galleryReducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let galleryFrame = 0, galleryLastFrame = 0;

function initCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    particles = [];
    mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
    mouseActive = false;
    
    const count = Math.min(Math.floor((width * height) / 9000), mobileGallery ? 40 : 150);
    
    for (let i = 0; i < count; i++) {
        const hx = Math.random() * width;
        const hy = Math.random() * height;
        particles.push({
            x: hx,
            y: hy,
            homeX: hx, 
            homeY: hy,
            vx: 0,
            vy: 0,
            size: Math.random() * 1.5 + 0.5,
            opacity: Math.random() * 0.5 + 0.2,
            hue: Math.random() * 60 + 240,
            pulse: Math.random() * Math.PI * 2,
            orbitDir: Math.random() > 0.5 ? 1 : -1 
        });
    }
}

function drawParticles(now) {
    if (mobileGallery) {
        galleryFrame = 0;
        if (document.hidden || galleryReducedMotion.matches) return;
        if (galleryLastFrame && now - galleryLastFrame < 1000/30 - 1) { galleryFrame = requestAnimationFrame(drawParticles); return; }
        galleryLastFrame = now || 0;
    }
    ctx.clearRect(0, 0, width, height);
    
    const mouseSpeed = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
    
    particles.forEach((p, i) => {
        const dxHome = p.homeX - p.x;
        const dyHome = p.homeY - p.y;
        p.vx += dxHome * 0.0025; 
        p.vy += dyHome * 0.0025;
        
        if (mouseActive) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            const radius = 180 + Math.min(mouseSpeed * 8, 200);
            
            if (dist < radius && dist > 1) {
                const angle = Math.atan2(dy, dx);
                const force = (radius - dist) / radius;
                
                const repel = force * (1.8 + mouseSpeed * 0.15);
                p.vx -= (dx / dist) * repel;
                p.vy -= (dy / dist) * repel;
                
                const tangent = force * 1.5;
                p.vx += -Math.sin(angle) * tangent * p.orbitDir;
                p.vy += Math.cos(angle) * tangent * p.orbitDir;
            }
        }
        
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92; 
        p.vy *= 0.92;
        
        if (p.x < -50) p.vx += 0.5;
        if (p.x > width + 50) p.vx -= 0.5;
        if (p.y < -50) p.vy += 0.5;
        if (p.y > height + 50) p.vy -= 0.5;
        
        p.pulse += 0.02;
        
        const pulseOpacity = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse));
        
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4);
        gradient.addColorStop(0, `hsla(${p.hue}, 70%, 70%, ${pulseOpacity})`);
        gradient.addColorStop(1, `hsla(${p.hue}, 70%, 70%, 0)`);
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 4, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 80%, 85%, ${pulseOpacity})`;
        ctx.fill();
        
        for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dSq = dx * dx + dy * dy;
            const maxDist = 140;
            if (dSq < maxDist * maxDist) {
                const d = Math.sqrt(dSq);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                const lineOpacity = (1 - d / maxDist) * 0.15;
                ctx.strokeStyle = `hsla(${(p.hue + p2.hue) / 2}, 60%, 60%, ${lineOpacity})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    });
    
    if (mobileGallery) galleryFrame = requestAnimationFrame(drawParticles);
    else requestAnimationFrame(drawParticles);
}

initCanvas();
drawParticles();
if (mobileGallery) {
    function resumeGalleryBackground() {
        cancelAnimationFrame(galleryFrame); galleryFrame = 0; galleryLastFrame = 0;
        if (!document.hidden && !galleryReducedMotion.matches) galleryFrame = requestAnimationFrame(drawParticles);
    }
    document.addEventListener('visibilitychange', resumeGalleryBackground);
    galleryReducedMotion.addEventListener('change', resumeGalleryBackground);
    window.addEventListener('pagehide', () => { cancelAnimationFrame(galleryFrame); galleryFrame = 0; });
    window.addEventListener('pageshow', resumeGalleryBackground);
}

window.addEventListener('resize', initCanvas);

let lastMouseX = 0, lastMouseY = 0;
document.addEventListener('mousemove', e => {
    mouse.vx = e.clientX - lastMouseX;
    mouse.vy = e.clientY - lastMouseY;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    mouseActive = true;
    
    clearTimeout(window.mouseTimeout);
    window.mouseTimeout = setTimeout(() => {
        mouseActive = false;
        mouse.vx = 0;
        mouse.vy = 0;
    }, 2000);
});

// 鼠标跟随光效
const cursorGlow = document.getElementById('cursorGlow');
let mouseXGlow = 0, mouseYGlow = 0;
let glowX = 0, glowY = 0;

document.addEventListener('mousemove', e => {
    mouseXGlow = e.clientX;
    mouseYGlow = e.clientY;
});

function animateGlow() {
    glowX += (mouseXGlow - glowX) * 0.08;
    glowY += (mouseYGlow - glowY) * 0.08;
    cursorGlow.style.left = glowX + 'px';
    cursorGlow.style.top = glowY + 'px';
    requestAnimationFrame(animateGlow);
}
if (!mobileGallery) animateGlow();

// 滚动进度条
const progressBar = document.getElementById('scrollProgress');
window.addEventListener('scroll', () => {
    const scrolled = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrolled / docHeight) * 100 : 0;
    progressBar.style.width = progress + '%';
});

// 自动探测图片数量
const images = [];
let i = 1;

function probe() {
    const img = new Image();
    img.onload = () => { 
        images.push(`${i}.jpg`); 
        i++; 
        probe(); 
    };
    img.onerror = () => { init(); };
    img.src = `${i}.jpg`;
}

function init() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    
    images.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.onclick = () => openLightbox(idx);
        if (mobileGallery) {
            item.tabIndex=0;item.setAttribute('role','button');item.setAttribute('aria-label',`查看图片 ${idx+1}`);
            item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLightbox(idx);}});
        }
        
        item.innerHTML = `
            <div class="img-wrapper">
                <img src="${src}" alt="图片 ${idx + 1}" loading="lazy">
                <div class="overlay">
                    <div class="overlay-content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                        </svg>
                        <span>查看大图</span>
                    </div>
                </div>
            </div>
        `;
        
        const img = item.querySelector('img');
        img.onload = () => img.classList.add('loaded');
        gallery.appendChild(item);
    });
    
    generateThumbnails();
    observeItems();
}

function observeItems() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const siblings = Array.from(entry.target.parentNode.children);
                const idx = siblings.indexOf(entry.target);
                entry.target.style.transitionDelay = `${(idx % 5) * 0.08}s`;
                
                entry.target.classList.add('revealed');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.05 });
    
    document.querySelectorAll('.gallery-item').forEach(item => {
        observer.observe(item);
    });
}

probe();

// 灯箱逻辑
let current = 0;
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbCounter = document.getElementById('lightbox-counter');
const thumbnailsContainer = document.getElementById('thumbnails');
if (mobileGallery) {
    lightbox.querySelector('.lightbox-close').setAttribute('aria-label','关闭图片');
    lightbox.querySelector('.prev').setAttribute('aria-label','上一张图片');
    lightbox.querySelector('.next').setAttribute('aria-label','下一张图片');
    lightbox.addEventListener('keydown',e=>{
        if(e.key!=='Tab')return;
        const controls=Array.from(lightbox.querySelectorAll('button'));
        const first=controls[0],last=controls[controls.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    });
}

function generateThumbnails() {
    thumbnailsContainer.innerHTML = '';
    images.forEach((src, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb' + (idx === current ? ' active' : '');
        thumb.innerHTML = `<img src="${src}" alt="">`;
        thumb.onclick = () => {
            current = idx;
            updateLightbox();
        };
        thumbnailsContainer.appendChild(thumb);
    });
}

function openLightbox(index) {
    if (mobileGallery) { lightbox.__returnFocus = document.activeElement; lightbox.__scrollY=scrollY; }
    current = index;
    updateLightbox();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
    if (mobileGallery) { lightbox.setAttribute('role','dialog'); lightbox.setAttribute('aria-modal','true'); lightbox.setAttribute('aria-label','图片查看器'); lightbox.querySelector('.lightbox-close').focus(); }
}

function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
    if (mobileGallery) { lightbox.__returnFocus?.focus({preventScroll:true}); scrollTo(0,lightbox.__scrollY||0); }
}

function navigate(dir) {
    current = (current + dir + images.length) % images.length;
    updateLightbox();
}

function updateLightbox() {
    lbImg.src = images[current];
    lbCounter.textContent = `${current + 1} / ${images.length}`;
    
    document.querySelectorAll('.lightbox-thumbnails .thumb').forEach((t, idx) => {
        t.classList.toggle('active', idx === current);
    });
    
    const activeThumb = thumbnailsContainer.children[current];
    if (activeThumb) {
        activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
    
    lbImg.style.animation = 'none';
    lbImg.offsetHeight;
    lbImg.style.animation = 'imgZoomIn 0.4s cubic-bezier(0.23, 1, 0.32, 1)';
}

// 键盘操作
document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
});

// 滚轮切换图片
lightbox.addEventListener('wheel', e => {
    if (!lightbox.classList.contains('active')) return;
    e.preventDefault();
    if (e.deltaY > 0) {
        navigate(1);
    } else {
        navigate(-1);
    }
}, { passive: false });

// 点击背景关闭
lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
});

// 触摸滑动支持
let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener('touchstart', e => {
    if (mobileGallery) {
        const t=e.touches[0];
        lightbox.__gesture = e.touches.length===1 && !e.target.closest('button,.lightbox-thumbnails') && t.clientX>24 && t.clientX<innerWidth-24 ? {x:t.clientX,y:t.clientY,time:Date.now()} : null;
        return;
    }
    touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

lightbox.addEventListener('touchend', e => {
    if (mobileGallery) {
        const start=lightbox.__gesture;lightbox.__gesture=null;
        if(!start||e.touches.length||!e.changedTouches.length||Date.now()-start.time>650||(visualViewport&&visualViewport.scale>1.05))return;
        const t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;
        if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.7)navigate(dx<0?1:-1);
        return;
    }
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 50) {
        navigate(diff > 0 ? 1 : -1);
    }
}, { passive: true });

lightbox.addEventListener('touchmove', e => { if(mobileGallery && e.touches.length!==1)lightbox.__gesture=null; }, {passive:true});
lightbox.addEventListener('touchcancel', () => { if(mobileGallery)lightbox.__gesture=null; }, {passive:true});

// 3D 倾斜效果
document.addEventListener('mousemove', e => {
    document.querySelectorAll('.gallery-item.revealed').forEach(item => {
        const rect = item.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / centerY * -3;
            const rotateY = (x - centerX) / centerX * 3;
            item.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale(1.02)`;
        } else {
            item.style.transform = '';
        }
    });
});
</script>
